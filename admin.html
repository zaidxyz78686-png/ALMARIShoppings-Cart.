<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALMARI Shoppings - Admin</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f5f4;
    }

    .header {
      background: #000;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 26px;
      font-weight: bold;
    }

    .login-box {
      max-width: 400px;
      margin: 80px auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.15);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      box-sizing: border-box;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #0a8f3d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #067530;
    }

    #error {
      color: red;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>

<body>

  <div class="header">
    ALMARI Shoppings
  </div>

  <div class="login-box">
    <h2>Admin Login</h2>
    <p>Enter admin password to view orders.</p>

    <input
      type="password"
      id="password"
      placeholder="Enter Password"
    >

    <button onclick="login()">LOGIN</button>

    <div id="error">Incorrect password!</div>
  </div>

  <script>
    const ADMIN_PASSWORD = "M.Umar.xyz.786";

    function login() {
      const password = document.getElementById("password").value;
      const error = document.getElementById("error");

      if (password === ADMIN_PASSWORD) {
        sessionStorage.setItem("adminAccess", "true");
        window.location.href = "orders.html";
      } else {
        error.style.display = "block";
      }
    }
  </script>

</body>
</html>
